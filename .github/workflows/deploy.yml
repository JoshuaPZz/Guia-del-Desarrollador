name: Desplegar Guia a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permite que el token de GITHUB_TOKEN despliegue a GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite un solo despliegue concurrente, saltándose ejecuciones intermedias
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Instalar Dependencias
        run: npm ci

      - name: Construir Sitio con VitePress
        run: npm run docs:build

      - name: Subir Artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Desplegar a GitHub Pages
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
